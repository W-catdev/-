<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>防空炮台·终极伤痕版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* HUD 顶部信息栏 */
        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.6);
            border-bottom: 2px solid #e94560;
            box-shadow: 0 2px 20px rgba(233, 69, 96, 0.3);
            z-index: 100;
        }

        .hud-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #fff;
            min-width: 60px;
        }

        .hud-label {
            font-size: 10px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .hud-value {
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 0 10px currentColor;
        }

        .hud-value.game-count { color: #00d4ff; }
        .hud-value.time { color: #ffd700; }
        .hud-value.score { color: #00ff88; }
        .hud-value.durability { color: #ff4757; }

        .durability-bar {
            width: 80px;
            height: 6px;
            background: #333;
            border-radius: 3px;
            margin-top: 4px;
            overflow: hidden;
        }

        .durability-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff4757, #ff6b7a);
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        /* 游戏画布区域 */
        .game-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            cursor: crosshair;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* 控制面板 */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.7);
            border-top: 2px solid #e94560;
            z-index: 100;
        }

        .control-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .control-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            transition: left 0.3s ease;
        }

        .control-btn:hover::before {
            left: 100%;
        }

        .control-btn:active {
            transform: scale(0.95);
        }

        .btn-rotate-left {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-rotate-right {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
        }

        .btn-fire {
            background: linear-gradient(135deg, #ff4757 0%, #ff6b7a 100%);
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.5);
            font-size: 16px;
            padding: 14px 32px;
        }

        .btn-repair {
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.4);
        }

        /* 游戏状态覆盖层 */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.85);
            z-index: 200;
            transition: opacity 0.5s ease;
        }

        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .overlay h1 {
            font-size: 48px;
            color: #e94560;
            text-shadow: 0 0 30px rgba(233, 69, 96, 0.8);
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }

        .overlay p {
            color: #aaa;
            font-size: 18px;
            margin-bottom: 30px;
        }

        .start-btn {
            padding: 16px 48px;
            font-size: 20px;
            background: linear-gradient(135deg, #e94560 0%, #ff6b7a 100%);
            border: none;
            border-radius: 12px;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 6px 30px rgba(233, 69, 96, 0.5);
            transition: transform 0.2s ease;
        }

        .start-btn:hover {
            transform: scale(1.05);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* 伤害闪烁效果 */
        .damage-flash {
            animation: damageFlash 0.3s ease;
        }

        @keyframes damageFlash {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(2) sepia(1) hue-rotate(-50deg) saturate(3); }
        }

        /* 连击显示 */
        .combo-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 36px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
            pointer-events: none;
            opacity: 0;
            z-index: 150;
        }

        .combo-display.show {
            animation: comboAnim 1s ease forwards;
        }

        @keyframes comboAnim {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            20% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
            80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -60%); }
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .hud-value { font-size: 14px; }
            .hud-label { font-size: 9px; }
            .control-btn { padding: 10px 16px; font-size: 12px; }
            .btn-fire { padding: 12px 24px; font-size: 14px; }
            .overlay h1 { font-size: 32px; }
        }
    </style>
</head>
<body>
    <!-- HUD 顶部信息栏 -->
    <div class="hud">
        <div class="hud-item">
            <span class="hud-label">第几次游戏</span>
            <span class="hud-value game-count" id="gameCount">1</span>
        </div>
        <div class="hud-item">
            <span class="hud-label">时间</span>
            <span class="hud-value time" id="gameTime">00:00</span>
        </div>
        <div class="hud-item">
            <span class="hud-label">得分</span>
            <span class="hud-value score" id="score">0</span>
        </div>
        <div class="hud-item">
            <span class="hud-label">耐久度</span>
            <span class="hud-value durability" id="durabilityText">100%</span>
            <div class="durability-bar">
                <div class="durability-fill" id="durabilityBar" style="width: 100%"></div>
            </div>
        </div>
    </div>

    <!-- 游戏画布 -->
    <div class="game-container" id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div class="combo-display" id="comboDisplay">连击 x3!</div>

        <!-- 开始/结束覆盖层 -->
        <div class="overlay" id="overlay">
            <h1>防空炮台·终极伤痕版</h1>
            <p>鼠标移动瞄准 · 点击开火 · 保卫你的阵地</p>
            <button class="start-btn" id="startBtn">开始战斗</button>
        </div>
    </div>

    <!-- 控制面板 -->
    <div class="controls">
        <button class="control-btn btn-rotate-left" id="rotateLeft">← 左转</button>
        <button class="control-btn btn-fire" id="fireBtn">🔥 开火</button>
        <button class="control-btn btn-repair" id="repairBtn">🔧 维修</button>
        <button class="control-btn btn-rotate-right" id="rotateRight">右转 →</button>
    </div>

    <script>
        // ==================== 游戏核心 ====================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('gameContainer');

        // 游戏状态
        let gameState = 'menu'; // menu, playing, gameover
        let gameCount = 1;
        let score = 0;
        let durability = 100;
        let maxDurability = 100;
        let gameTime = 0;
        let lastTime = 0;
        let combo = 0;
        let comboTimer = 0;

        // 炮台
        const turret = {
            x: 0,
            y: 0,
            angle: -Math.PI / 2,
            targetAngle: -Math.PI / 2,
            barrelLength: 80,
            width: 60,
            height: 40,
            recoil: 0,
            maxRecoil: 15,
            fireRate: 150,
            lastFire: 0,
            color: '#4a4a6a'
        };

        // 鼠标位置
        let mouseX = 0;
        let mouseY = 0;

        // 游戏对象数组
        let bullets = [];
        let enemies = [];
        let bombs = [];
        let particles = [];
        let explosions = [];
        let stars = [];

        // 难度系统
        let difficulty = 1;
        let enemySpawnTimer = 0;
        let enemySpawnInterval = 2000;

        // 维修系统
        let repairCooldown = 0;
        const REPAIR_COOLDOWN = 10000;
        const REPAIR_AMOUNT = 30;

        // ==================== 初始化 ====================
        function resize() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            turret.x = canvas.width / 2;
            turret.y = canvas.height - 80;
            initStars();
        }

        function initStars() {
            stars = [];
            for (let i = 0; i < 100; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height * 0.7,
                    size: Math.random() * 2 + 0.5,
                    brightness: Math.random(),
                    twinkleSpeed: Math.random() * 0.02 + 0.01
                });
            }
        }

        window.addEventListener('resize', resize);
        resize();

        // ==================== 输入处理 ====================
        container.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
            updateTurretAngle();
        });

        container.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            mouseX = touch.clientX - rect.left;
            mouseY = touch.clientY - rect.top;
            updateTurretAngle();
        }, { passive: false });

        container.addEventListener('mousedown', (e) => {
            if (gameState === 'playing') fire();
        });

        container.addEventListener('touchstart', (e) => {
            if (gameState === 'playing') fire();
        }, { passive: true });

        function updateTurretAngle() {
            const dx = mouseX - turret.x;
            const dy = mouseY - turret.y;
            turret.targetAngle = Math.atan2(dy, dx);
        }

        // 按钮控制
        let rotateLeftPressed = false;
        let rotateRightPressed = false;

        document.getElementById('rotateLeft').addEventListener('mousedown', () => rotateLeftPressed = true);
        document.getElementById('rotateLeft').addEventListener('mouseup', () => rotateLeftPressed = false);
        document.getElementById('rotateLeft').addEventListener('touchstart', (e) => { e.preventDefault(); rotateLeftPressed = true; });
        document.getElementById('rotateLeft').addEventListener('touchend', () => rotateLeftPressed = false);

        document.getElementById('rotateRight').addEventListener('mousedown', () => rotateRightPressed = true);
        document.getElementById('rotateRight').addEventListener('mouseup', () => rotateRightPressed = false);
        document.getElementById('rotateRight').addEventListener('touchstart', (e) => { e.preventDefault(); rotateRightPressed = true; });
        document.getElementById('rotateRight').addEventListener('touchend', () => rotateRightPressed = false);

        document.getElementById('fireBtn').addEventListener('click', () => {
            if (gameState === 'playing') fire();
        });

        document.getElementById('repairBtn').addEventListener('click', repair);

        // 键盘控制
        document.addEventListener('keydown', (e) => {
            if (gameState !== 'playing') return;
            switch(e.key) {
                case 'ArrowLeft':
                case 'a':
                    rotateLeftPressed = true;
                    break;
                case 'ArrowRight':
                case 'd':
                    rotateRightPressed = true;
                    break;
                case ' ':
                case 'Enter':
                    fire();
                    break;
                case 'r':
                    repair();
                    break;
            }
        });

        document.addEventListener('keyup', (e) => {
            switch(e.key) {
                case 'ArrowLeft':
                case 'a':
                    rotateLeftPressed = false;
                    break;
                case 'ArrowRight':
                case 'd':
                    rotateRightPressed = false;
                    break;
            }
        });

        // ==================== 游戏逻辑 ====================
        function startGame() {
            gameState = 'playing';
            score = 0;
            durability = 100;
            gameTime = 0;
            combo = 0;
            difficulty = 1;
            enemySpawnInterval = 2000;
            repairCooldown = 0;

            bullets = [];
            enemies = [];
            bombs = [];
            particles = [];
            explosions = [];

            turret.angle = -Math.PI / 2;
            turret.targetAngle = -Math.PI / 2;
            turret.recoil = 0;

            document.getElementById('overlay').classList.add('hidden');
            document.getElementById('score').textContent = '0';
            document.getElementById('durabilityText').textContent = '100%';
            document.getElementById('durabilityBar').style.width = '100%';

            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameState = 'gameover';
            gameCount++;
            document.getElementById('gameCount').textContent = gameCount;

            const overlay = document.getElementById('overlay');
            overlay.classList.remove('hidden');
            overlay.querySelector('h1').textContent = '阵地失守';
            overlay.querySelector('p').textContent = `最终得分: ${score} | 存活时间: ${formatTime(gameTime)}`;
            overlay.querySelector('.start-btn').textContent = '再次战斗';
        }

        function formatTime(ms) {
            const seconds = Math.floor(ms / 1000);
            const minutes = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function fire() {
            const now = performance.now();
            if (now - turret.lastFire < turret.fireRate) return;
            turret.lastFire = now;

            // 后坐力
            turret.recoil = turret.maxRecoil;

            // 创建子弹
            const speed = 12;
            bullets.push({
                x: turret.x + Math.cos(turret.angle) * turret.barrelLength,
                y: turret.y + Math.sin(turret.angle) * turret.barrelLength,
                vx: Math.cos(turret.angle) * speed,
                vy: Math.sin(turret.angle) * speed,
                radius: 4,
                damage: 25 + difficulty * 5,
                trail: []
            });

            // 炮口火焰粒子
            for (let i = 0; i < 8; i++) {
                const angle = turret.angle + (Math.random() - 0.5) * 0.5;
                particles.push({
                    x: turret.x + Math.cos(turret.angle) * turret.barrelLength,
                    y: turret.y + Math.sin(turret.angle) * turret.barrelLength,
                    vx: Math.cos(angle) * (Math.random() * 5 + 2),
                    vy: Math.sin(angle) * (Math.random() * 5 + 2),
                    life: 1,
                    decay: 0.05,
                    color: `hsl(${Math.random() * 40 + 10}, 100%, 60%)`,
                    size: Math.random() * 6 + 3
                });
            }

            // 开火音效（视觉反馈）
            container.style.transform = 'scale(1.01)';
            setTimeout(() => container.style.transform = 'scale(1)', 50);
        }

        function repair() {
            if (repairCooldown > 0) return;
            if (durability >= maxDurability) return;

            durability = Math.min(maxDurability, durability + REPAIR_AMOUNT);
            repairCooldown = REPAIR_COOLDOWN;

            // 维修特效
            for (let i = 0; i < 20; i++) {
                particles.push({
                    x: turret.x + (Math.random() - 0.5) * 60,
                    y: turret.y + (Math.random() - 0.5) * 40,
                    vx: (Math.random() - 0.5) * 2,
                    vy: -Math.random() * 3 - 1,
                    life: 1,
                    decay: 0.02,
                    color: '#00ff88',
                    size: Math.random() * 4 + 2
                });
            }

            updateHUD();
        }

        function spawnEnemy() {
            const types = ['bomber', 'fighter', 'heavy'];
            const type = types[Math.floor(Math.random() * types.length)];

            const enemy = {
                x: Math.random() * (canvas.width - 100) + 50,
                y: -50,
                type: type,
                hp: type === 'heavy' ? 150 : type === 'bomber' ? 80 : 40,
                maxHp: type === 'heavy' ? 150 : type === 'bomber' ? 80 : 40,
                speed: type === 'heavy' ? 0.8 : type === 'bomber' ? 1.5 : 2.5,
                width: type === 'heavy' ? 60 : type === 'bomber' ? 50 : 35,
                height: type === 'heavy' ? 40 : type === 'bomber' ? 30 : 20,
                color: type === 'heavy' ? '#8b0000' : type === 'bomber' ? '#ff6600' : '#ff0066',
                dropBomb: type === 'bomber',
                bombTimer: Math.random() * 2000 + 1000,
                wobble: Math.random() * Math.PI * 2,
                wobbleSpeed: Math.random() * 0.02 + 0.01
            };

            enemies.push(enemy);
        }

        function dropBomb(enemy) {
            bombs.push({
                x: enemy.x,
                y: enemy.y + enemy.height / 2,
                vy: 3,
                radius: 8,
                damage: 15,
                rotation: 0
            });
        }

        function createExplosion(x, y, color, size) {
            explosions.push({
                x: x,
                y: y,
                radius: 0,
                maxRadius: size,
                alpha: 1,
                color: color
            });

            for (let i = 0; i < 15; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 4 + 2;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1,
                    decay: Math.random() * 0.03 + 0.02,
                    color: color,
                    size: Math.random() * 5 + 2
                });
            }
        }

        function showCombo(count) {
            const display = document.getElementById('comboDisplay');
            display.textContent = `连击 x${count}!`;
            display.classList.remove('show');
            void display.offsetWidth;
            display.classList.add('show');
        }

        // ==================== 更新逻辑 ====================
        function update(deltaTime) {
            if (gameState !== 'playing') return;

            gameTime += deltaTime;
            document.getElementById('gameTime').textContent = formatTime(gameTime);

            // 难度递增
            difficulty = 1 + gameTime / 30000;
            enemySpawnInterval = Math.max(500, 2000 - gameTime / 50);

            // 炮台旋转
            if (rotateLeftPressed) turret.targetAngle -= 0.05;
            if (rotateRightPressed) turret.targetAngle += 0.05;

            // 平滑旋转
            let angleDiff = turret.targetAngle - turret.angle;
            while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
            while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
            turret.angle += angleDiff * 0.1;

            // 后坐力恢复
            if (turret.recoil > 0) turret.recoil -= 1;

            // 维修冷却
            if (repairCooldown > 0) {
                repairCooldown -= deltaTime;
                const btn = document.getElementById('repairBtn');
                if (repairCooldown <= 0) {
                    btn.style.opacity = '1';
                    btn.textContent = '🔧 维修';
                } else {
                    btn.style.opacity = '0.5';
                    btn.textContent = `🔧 ${Math.ceil(repairCooldown / 1000)}s`;
                }
            }

            // 生成敌人
            enemySpawnTimer += deltaTime;
            if (enemySpawnTimer >= enemySpawnInterval) {
                enemySpawnTimer = 0;
                spawnEnemy();
            }

            // 更新子弹
            bullets = bullets.filter(bullet => {
                bullet.trail.push({ x: bullet.x, y: bullet.y });
                if (bullet.trail.length > 8) bullet.trail.shift();

                bullet.x += bullet.vx;
                bullet.y += bullet.vy;

                return bullet.x > -10 && bullet.x < canvas.width + 10 && 
                       bullet.y > -10 && bullet.y < canvas.height + 10;
            });

            // 更新敌人
            enemies = enemies.filter(enemy => {
                enemy.y += enemy.speed;
                enemy.wobble += enemy.wobbleSpeed;
                enemy.x += Math.sin(enemy.wobble) * 0.5;

                // 投弹
                if (enemy.dropBomb) {
                    enemy.bombTimer -= deltaTime;
                    if (enemy.bombTimer <= 0) {
                        dropBomb(enemy);
                        enemy.bombTimer = Math.random() * 2000 + 1500;
                    }
                }

                // 到达底部
                if (enemy.y > canvas.height + 50) {
                    durability -= 10;
                    updateHUD();
                    createExplosion(enemy.x, canvas.height - 20, '#ff4757', 30);
                    combo = 0;

                    if (durability <= 0) {
                        gameOver();
                    }
                    return false;
                }

                return true;
            });

            // 更新炸弹
            bombs = bombs.filter(bomb => {
                bomb.y += bomb.vy;
                bomb.rotation += 0.1;

                // 检测是否击中炮台
                const dist = Math.hypot(bomb.x - turret.x, bomb.y - turret.y);
                if (dist < 40) {
                    durability -= bomb.damage;
                    updateHUD();
                    createExplosion(bomb.x, bomb.y, '#ff6600', 40);
                    combo = 0;

                    // 伤害闪烁
                    container.classList.add('damage-flash');
                    setTimeout(() => container.classList.remove('damage-flash'), 300);

                    if (durability <= 0) {
                        gameOver();
                    }
                    return false;
                }

                return bomb.y < canvas.height + 20;
            });

            // 碰撞检测：子弹 vs 敌人
            bullets.forEach((bullet, bi) => {
                enemies.forEach((enemy, ei) => {
                    const dist = Math.hypot(bullet.x - enemy.x, bullet.y - enemy.y);
                    if (dist < enemy.width / 2 + bullet.radius) {
                        enemy.hp -= bullet.damage;
                        bullet.hit = true;

                        if (enemy.hp <= 0) {
                            // 击杀得分
                            const baseScore = enemy.type === 'heavy' ? 500 : enemy.type === 'bomber' ? 300 : 100;
                            combo++;
                            const comboMultiplier = Math.min(combo, 10);
                            const points = baseScore * comboMultiplier;
                            score += points;

                            if (combo >= 3) showCombo(combo);

                            createExplosion(enemy.x, enemy.y, enemy.color, 50);
                            enemies.splice(ei, 1);
                        } else {
                            // 命中特效
                            createExplosion(bullet.x, bullet.y, '#ffff00', 15);
                        }

                        updateHUD();
                    }
                });
            });

            bullets = bullets.filter(b => !b.hit);

            // 更新粒子
            particles = particles.filter(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.1; // 重力
                p.life -= p.decay;
                return p.life > 0;
            });

            // 更新爆炸
            explosions = explosions.filter(e => {
                e.radius += 2;
                e.alpha -= 0.04;
                return e.alpha > 0;
            });

            // 连击计时器
            if (combo > 0) {
                comboTimer += deltaTime;
                if (comboTimer > 3000) {
                    combo = 0;
                    comboTimer = 0;
                }
            }

            // 更新星星闪烁
            stars.forEach(star => {
                star.brightness += star.twinkleSpeed;
                if (star.brightness > 1 || star.brightness < 0.3) {
                    star.twinkleSpeed *= -1;
                }
            });
        }

        function updateHUD() {
            document.getElementById('score').textContent = score.toLocaleString();
            document.getElementById('durabilityText').textContent = Math.max(0, Math.ceil(durability)) + '%';
            document.getElementById('durabilityBar').style.width = Math.max(0, durability) + '%';

            // 耐久度颜色变化
            const bar = document.getElementById('durabilityBar');
            if (durability > 60) {
                bar.style.background = 'linear-gradient(90deg, #00ff88, #00cc6a)';
            } else if (durability > 30) {
                bar.style.background = 'linear-gradient(90deg, #ffd700, #ffaa00)';
            } else {
                bar.style.background = 'linear-gradient(90deg, #ff4757, #ff6b7a)';
            }
        }

        // ==================== 渲染 ====================
        function draw() {
            // 清空画布
            ctx.fillStyle = 'rgba(26, 26, 46, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 绘制星星
            stars.forEach(star => {
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${star.brightness})`;
                ctx.fill();
            });

            // 绘制地面
            ctx.fillStyle = '#2d2d44';
            ctx.fillRect(0, canvas.height - 40, canvas.width, 40);
            ctx.fillStyle = '#3d3d5c';
            ctx.fillRect(0, canvas.height - 40, canvas.width, 5);

            // 绘制炮台底座
            ctx.save();
            ctx.translate(turret.x, turret.y);

            // 底座
            ctx.fillStyle = '#3a3a5c';
            ctx.beginPath();
            ctx.arc(0, 0, 35, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#5a5a7c';
            ctx.lineWidth = 3;
            ctx.stroke();

            // 炮管
            ctx.rotate(turret.angle);
            const recoilOffset = turret.recoil;

            // 炮管阴影
            ctx.fillStyle = '#2a2a4a';
            ctx.fillRect(-8, -8, turret.barrelLength + 10, 16);

            // 炮管主体
            const gradient = ctx.createLinearGradient(0, -10, 0, 10);
            gradient.addColorStop(0, '#5a5a7c');
            gradient.addColorStop(0.5, '#7a7a9c');
            gradient.addColorStop(1, '#4a4a6a');
            ctx.fillStyle = gradient;
            ctx.fillRect(-recoilOffset, -10, turret.barrelLength, 20);

            // 炮口
            ctx.fillStyle = '#8a8aac';
            ctx.fillRect(turret.barrelLength - recoilOffset - 5, -12, 10, 24);

            ctx.restore();

            // 绘制炮台主体
            ctx.save();
            ctx.translate(turret.x, turret.y);

            // 主体
            ctx.fillStyle = '#4a4a6a';
            ctx.beginPath();
            ctx.arc(0, 0, 25, 0, Math.PI * 2);
            ctx.fill();

            // 细节
            ctx.strokeStyle = '#6a6a8c';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 0, 20, 0, Math.PI * 2);
            ctx.stroke();

            // 核心
            ctx.fillStyle = durability > 30 ? '#00d4ff' : '#ff4757';
            ctx.beginPath();
            ctx.arc(0, 0, 10, 0, Math.PI * 2);
            ctx.fill();

            // 核心光晕
            ctx.shadowColor = durability > 30 ? '#00d4ff' : '#ff4757';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.arc(0, 0, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.restore();

            // 绘制子弹
            bullets.forEach(bullet => {
                // 尾迹
                bullet.trail.forEach((pos, i) => {
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, bullet.radius * (i / bullet.trail.length), 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 215, 0, ${i / bullet.trail.length * 0.5})`;
                    ctx.fill();
                });

                // 子弹主体
                ctx.beginPath();
                ctx.arc(bullet.x, bullet.y, bullet.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#ffd700';
                ctx.shadowColor = '#ffd700';
                ctx.shadowBlur = 10;
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            // 绘制敌人
            enemies.forEach(enemy => {
                ctx.save();
                ctx.translate(enemy.x, enemy.y);

                // 机身
                ctx.fillStyle = enemy.color;
                ctx.beginPath();
                ctx.ellipse(0, 0, enemy.width / 2, enemy.height / 2, 0, 0, Math.PI * 2);
                ctx.fill();

                // 机翼
                ctx.fillStyle = enemy.color;
                ctx.beginPath();
                ctx.moveTo(-enemy.width / 2, 0);
                ctx.lineTo(-enemy.width * 0.8, -enemy.height * 0.8);
                ctx.lineTo(-enemy.width * 0.5, 0);
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(enemy.width / 2, 0);
                ctx.lineTo(enemy.width * 0.8, -enemy.height * 0.8);
                ctx.lineTo(enemy.width * 0.5, 0);
                ctx.fill();

                // 驾驶舱
                ctx.fillStyle = '#00d4ff';
                ctx.beginPath();
                ctx.ellipse(0, -enemy.height / 4, enemy.width / 6, enemy.height / 4, 0, 0, Math.PI * 2);
                ctx.fill();

                // 引擎火焰
                ctx.fillStyle = `rgba(255, 100, 0, ${0.5 + Math.random() * 0.5})`;
                ctx.beginPath();
                ctx.moveTo(-5, enemy.height / 2);
                ctx.lineTo(0, enemy.height / 2 + 15 + Math.random() * 10);
                ctx.lineTo(5, enemy.height / 2);
                ctx.fill();

                // 血条
                if (enemy.hp < enemy.maxHp) {
                    ctx.fillStyle = '#333';
                    ctx.fillRect(-20, -enemy.height / 2 - 10, 40, 4);
                    ctx.fillStyle = '#ff4757';
                    ctx.fillRect(-20, -enemy.height / 2 - 10, 40 * (enemy.hp / enemy.maxHp), 4);
                }

                ctx.restore();
            });

            // 绘制炸弹
            bombs.forEach(bomb => {
                ctx.save();
                ctx.translate(bomb.x, bomb.y);
                ctx.rotate(bomb.rotation);

                // 炸弹主体
                ctx.fillStyle = '#333';
                ctx.beginPath();
                ctx.arc(0, 0, bomb.radius, 0, Math.PI * 2);
                ctx.fill();

                // 引信
                ctx.fillStyle = '#ff6600';
                ctx.fillRect(-2, -bomb.radius - 5, 4, 8);

                // 火花
                ctx.fillStyle = `rgba(255, 100, 0, ${Math.random()})`;
                ctx.beginPath();
                ctx.arc(0, -bomb.radius - 8, 3, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            });

            // 绘制爆炸
            explosions.forEach(exp => {
                ctx.beginPath();
                ctx.arc(exp.x, exp.y, exp.radius, 0, Math.PI * 2);
                ctx.fillStyle = exp.color.replace(')', `, ${exp.alpha})`).replace('rgb', 'rgba').replace('#', '');
                // 处理十六进制颜色
                let r, g, b;
                if (exp.color.startsWith('#')) {
                    r = parseInt(exp.color.slice(1, 3), 16);
                    g = parseInt(exp.color.slice(3, 5), 16);
                    b = parseInt(exp.color.slice(5, 7), 16);
                } else {
                    r = 255; g = 100; b = 0;
                }
                ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${exp.alpha})`;
                ctx.fill();

                // 内圈
                ctx.beginPath();
                ctx.arc(exp.x, exp.y, exp.radius * 0.6, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 200, ${exp.alpha * 0.8})`;
                ctx.fill();
            });

            // 绘制粒子
            particles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                ctx.fillStyle = p.color.replace(')', `, ${p.life})`).replace('rgb', 'rgba');
                if (p.color.startsWith('#')) {
                    let r = parseInt(p.color.slice(1, 3), 16);
                    let g = parseInt(p.color.slice(3, 5), 16);
                    let b = parseInt(p.color.slice(5, 7), 16);
                    ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${p.life})`;
                } else if (p.color.startsWith('hsl')) {
                    ctx.fillStyle = p.color.replace(')', `, ${p.life})`);
                } else {
                    ctx.fillStyle = `rgba(255, 255, 255, ${p.life})`;
                }
                ctx.fill();
            });

            // 绘制准星
            if (gameState === 'playing') {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(mouseX, mouseY, 20, 0, Math.PI * 2);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(mouseX - 25, mouseY);
                ctx.lineTo(mouseX + 25, mouseY);
                ctx.moveTo(mouseX, mouseY - 25);
                ctx.lineTo(mouseX, mouseY + 25);
                ctx.stroke();
            }
        }

        // ==================== 游戏循环 ====================
        function gameLoop(timestamp) {
            const deltaTime = timestamp - lastTime;
            lastTime = timestamp;

            update(deltaTime);
            draw();

            if (gameState === 'playing') {
                requestAnimationFrame(gameLoop);
            }
        }

        // ==================== 事件绑定 ====================
        document.getElementById('startBtn').addEventListener('click', startGame);

        // 初始渲染
        resize();
        draw();
    </script>
</body>
</html>
